databaseChangeLog:
  - changeSet:
      id: 002-create-quizzes-table
      author: admin
      changes:
        - createTable:
            tableName: quizzes
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: INT
                  constraints:
                    nullable: false