databaseChangeLog:
  - changeSet:
      id: 003-create-questions-table
      author: admin
      changes:
        - createTable:
            tableName: questions
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: quiz_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: question_text
                  type: VARCHAR(255)
                  constraints:
                    nullable: false