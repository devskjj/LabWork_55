databaseChangeLog:
  - changeSet:
      id: 005-create-options-table
      author: admin
      changes:
        - createTable:
            tableName: options
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: question_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: option_text
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_correct
                  type: BOOLEAN
                  constraints:
                    nullable: false