databaseChangeLog:
  - changeSet:
      id: 009-create-user-answers-table
      author: admin
      changes:
        - createTable:
            tableName: user_answers
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: quiz_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: question_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: option_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: answered_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
