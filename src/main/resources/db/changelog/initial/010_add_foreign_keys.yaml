databaseChangeLog:
  - changeSet:
      id: 010-add-foreign-keys
      author: admin
      changes:
        - addForeignKeyConstraint:
            baseTableName: quizzes
            baseColumnNames: creator_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_quizzes_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: quiz_results
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_quiz_results_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: quiz_results
            baseColumnNames: quiz_id
            referencedTableName: quizzes
            referencedColumnNames: id
            constraintName: fk_quiz_results_quiz
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: questions
            baseColumnNames: quiz_id
            referencedTableName: quizzes
            referencedColumnNames: id
            constraintName: fk_questions_quiz
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: options
            baseColumnNames: question_id
            referencedTableName: questions
            referencedColumnNames: id
            constraintName: fk_options_question
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: top_scores
            baseColumnNames: result_id
            referencedTableName: quiz_results
            referencedColumnNames: id
            constraintName: fk_top_scores_quiz_result
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: quiz_timer
            baseColumnNames: quiz_id
            referencedTableName: quizzes
            referencedColumnNames: id
            constraintName: fk_quiz_timer_quiz

        - addForeignKeyConstraint:
            baseTableName: quiz_timer
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_quiz_timer_user

        - addForeignKeyConstraint:
            baseTableName: user_answers
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_answers_user

        - addForeignKeyConstraint:
            baseTableName: user_answers
            baseColumnNames: quiz_id
            referencedTableName: quizzes
            referencedColumnNames: id
            constraintName: fk_user_answers_quiz

        - addForeignKeyConstraint:
            baseTableName: user_answers
            baseColumnNames: question_id
            referencedTableName: questions
            referencedColumnNames: id
            constraintName: fk_user_answers_question

        - addForeignKeyConstraint:
            baseTableName: user_answers
            baseColumnNames: option_id
            referencedTableName: options
            referencedColumnNames: id
            constraintName: fk_user_answers_option
