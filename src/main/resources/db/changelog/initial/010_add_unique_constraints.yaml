databaseChangeLog:
  - changeSet:
      id: 010-add-unique-constraints
      author: admin
      changes:
        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: unique_user_email

        - addUniqueConstraint:
            tableName: top_scores
            columnNames: result_id
            constraintName: unique_top_scores_result

        - addUniqueConstraint:
            tableName: quiz_timer
            columnNames: quiz_id, user_id
            constraintName: unique_quiz_user